      addCal: () => say(_x('Tekrar tarihi takvimine eklendi')),
      c, s, lang, confetti, lvls,
      dir: rtl ? 'rtl' : 'ltr',
      W: ios ? 390 : 412, H: ios ? 844 : 915, topH: ios ? 54 : 36, bottomPad: ios ? 34 : 20,
      btnR: ios ? 14 : 100, btnH: ios ? 52 : 48,
      flip: rtl ? -1 : 1,
      done: go('plan', 'tomorrow'), toCards: go('cards'), toReader: go('reader'), toReview: go('review', 'lesson')
    };
  }
}
</script>
