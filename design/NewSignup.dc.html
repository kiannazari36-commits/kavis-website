      title1: signup ? _x('Hesabını') : _x('Tekrar'), title2: signup ? _x('oluştur') : _x('hoş geldin'),
      appleLabel: signup ? _x('Apple ile devam et') : _x('Apple ile giriş yap'),
      googleLabel: signup ? _x('Google ile devam et') : _x('Google ile giriş yap'),
      pwType: showPw ? 'text' : 'password', pwAuto: signup ? 'new-password' : 'current-password',
      pwAria: showPw ? _x('Şifreyi gizle') : _x('Şifreyi göster'),
      eyeIcon: showPw ? 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' : 'M3 3l18 18 M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9 M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6 M9.9 9.9a3 3 0 0 0 4.2 4.2',
      togglePw: () => this.setState({ showPw: !showPw }),
      consentStr: consent ? 'true' : 'false',
      chkBorder: consent ? '0' : '1.5px solid ' + c.text3, chkBg: consent ? c.cta : 'transparent', chkIcon: consent ? 'M5 12l5 5 9-10' : '',
      toggleConsent: () => this.setState({ consent: !consent }),
      ctaLabel: signup ? _x('Hesap oluştur') : _x('Giriş yap'),
      ctaDisabled: blocked ? 'true' : 'false',
      ctaBg: blocked ? c.seg : c.cta, ctaFg: blocked ? c.text3 : '#FFFCF6', ctaShadow: blocked ? 'none' : '0 12px 30px rgba(156,47,58,.28)',
      submit: () => { if (blocked) { say(_x('Önce kullanım koşullarını onayla (kutuyu işaretle)')); return; } if (signup) this.setState({ mode: 'verify', resend: 42 }); else go('home'); },
      social: () => go(signup ? 'onboarding' : 'home'),
      switchQ: signup ? _x('Zaten hesabın var mı?') : _x('Hesabın yok mu?'),
      switchA: signup ? _x('Giriş yap') : _x('Kayıt ol'),
      switchMode: () => this.setState({ mode: signup ? 'login' : 'signup' }),
      back: () => { if (mode === 'verify') this.setState({ mode: 'signup' }); else go('welcome'); },
      code: digits.map((v, i) => ({ v, border: (filled || i === 0) ? '1.5px solid ' + c.focus : '1px solid ' + c.line })),
      fillCode: () => this.setState({ filled: true }),
      resend: '0:' + (r < 10 ? '0' : '') + r,
      vBg: filled ? c.cta : c.seg, vFg: filled ? '#FFFCF6' : c.text3, vShadow: filled ? '0 12px 30px rgba(156,47,58,.28)' : 'none',
      verifyGo: () => { if (filled) go('onboarding'); else say(_x('Önce e-postadaki 6 haneli kodu gir')); }
    };
  }
}
