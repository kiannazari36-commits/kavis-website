    const tab = st.spTab || (p.variant === 'faq' ? 'faq' : 'chat');
    const spCat = st.spCat || ''; const spFaq = st.spFaq == null ? -1 : st.spFaq; const spMsgs = st.spMsgs || [];
    const dev = ios ? 'iPhone' : 'Android';
    const sendSp = (txt) => { const t = (txt || '').trim(); if (!t) { say(_x('Önce mesajını yaz')); return; } const now = '20:' + pad2(14 + spMsgs.length); this.setState({ spMsgs: spMsgs.concat([{ me: true, t, time: now }]), spDraft: '', spTyping: true }); clearTimeout(this.spT); this.spT = setTimeout(() => { const s2 = this.state || {}; const m2 = (s2.spMsgs || []).concat([{ me: false, t: _x('Teşekkürler Elif! Talebini aldık (#4821)') + (s2.spCat ? _x(' · konu: ') + s2.spCat : '') + _x('. Ekibimiz inceliyor; çözünce buradan ve bildirimle haber vereceğiz. Ekran görüntüsü eklersen daha hızlı çözeriz.'), time: '20:' + pad2(16 + spMsgs.length) }]); this.setState({ spMsgs: m2, spTyping: false }); }, 1400); };
    const chip = (on) => ({ on: on ? 'true' : 'false', bg: on ? '#9C2F3A' : c.card, fg: on ? '#FFFCF6' : c.text, border: on ? '0' : '1px solid ' + c.line });
    const sp = {
      status: _x('Çevrimiçi · genelde 2 saat içinde cevap'), ticket: spMsgs.length ? 'TALEP #4821' : _x('YENİ TALEP'),
      isChat: tab === 'chat', isFaq: tab === 'faq',
      tabs: [['chat', _x('Destekle konuş')], ['faq', _x('Sık sorulanlar')]].map((t) => { const on = t[0] === tab; return { l: t[1], on: on ? 'true' : 'false', bg: on ? c.pill : 'transparent', fg: on ? c.text : c.text2, fw: on ? 600 : 400, shadow: on ? '0 1px 4px rgba(0,0,0,.12)' : 'none', pick: () => this.setState({ spTab: t[0] }) }; }),
      cats: [_x('Uygulama hatası'), _x('PDF yükleme'), _x('Asistan cevabı yanlış'), _x('Hesap ve ödeme'), _x('Öneri')].map((t) => Object.assign(chip(t === spCat), { t, pick: () => this.setState({ spCat: spCat === t ? '' : t }) })),
      faq: [[_x('PDF\'im yüklenmiyor, ne yapmalıyım?'), _x('Dosya taranmış sayfalardan oluşuyorsa "Metin tanıma ile dene" seçeneğini kullan. 100 MB üstü dosyaları bölerek yükle.')], [_x('Asistan yanlış bir şey söyledi'), _x('Cevabın altındaki kaynak sayfasını kontrol et ve buradan bize yaz; ilgili sayfayı inceleyip düzeltiriz.')], [_x('Bildirimler gelmiyor'), ios ? _x('Ayarlar › Bildirimler bölümünden izin ver; iPhone Ayarları › Kavis Study › Bildirimler de açık olmalı.') : _x('Ayarlar › Bildirimler bölümünden izin ver; telefonun Ayarlar › Uygulamalar › Kavis Study › Bildirimler de açık olmalı.')], [_x('Aboneliğimi nasıl iptal ederim?'), ios ? _x('App Store › Abonelikler bölümünden istediğin zaman iptal edebilirsin.') : _x('Google Play › Ödemeler ve abonelikler bölümünden istediğin zaman iptal edebilirsin.')]].map((f, i) => { const open = i === spFaq; return { q: f[0], a: f[1], open, openStr: open ? 'true' : 'false', arrow: open ? '−' : '+', sep: i ? '1px solid ' + c.line : '0', tap: () => this.setState({ spFaq: open ? -1 : i }) }; }),
      msgs: [{ me: false, t: _x('Merhaba Elif! Ben Kavis Study destek ekibinden. Uygulamada bir sorun mu gördün? Konuyu seç ve kısaca yaz; gerekirse ekran görüntüsü ekle.'), time: '20:12' }].concat(spMsgs).map((m) => ({ t: m.t, time: m.time, align: m.me ? 'flex-end' : 'flex-start', bg: m.me ? '#9C2F3A' : bubble, fg: m.me ? '#FFFCF6' : c.text, border: m.me ? '0' : '1px solid ' + c.line, radius: m.me ? '18px 18px 6px 18px' : '18px 18px 18px 6px' })),
      typing: !!st.spTyping, draft: st.spDraft || '',
      autoNote: _x('Talebine uygulama sürümü, cihaz (') + dev + _x(') ve son açtığın ekran eklenir. Ders PDF\'lerin paylaşılmaz.'),
      devNote: _x('Uygulama sürümü 1.0 (') + dev + _x('), cihaz ve son açtığın ekran. Ders PDF\'lerin paylaşılmaz.'),
      type: (e) => this.setState({ spDraft: e && e.target ? e.target.value : '' }),
      send: () => sendSp(st.spDraft),
      quick: [_x('PDF yüklenmiyor'), _x('Uygulama donuyor'), _x('Ses kaydı çalışmıyor')].map((t) => ({ t, tap: () => sendSp(t) })),
      attach: () => { this.setState({ spMsgs: spMsgs.concat([{ me: true, t: _x('Ekran görüntüsü eklendi · ekran_20-14.png'), time: '20:' + pad2(14 + spMsgs.length) }]) }); },
      toChat: () => this.setState({ spTab: 'chat' })
    };
    return { c, sp, W: ios ? 390 : 412, H: ios ? 844 : 915, topH: ios ? 54 : 36, composerBottom: ios ? 30 : 16, toastOn: !!st.toast, toastMsg: st.toast || '', back: () => { if (p.go) p.go('settings'); else say(_x('Ayarlar açılır')); } };
  }
}
