<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Derslerim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<style>[dir=rtl] .dc-back{transform:scaleX(-1)}[dir=rtl],[dir=rtl] *{letter-spacing:0 !important}</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: {{W}}px; height: {{H}}px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Poppins, Vazirmatn, system-ui, sans-serif">
<div style="height: {{topH}}px; flex: none"></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 20px 0; flex: none">
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: {{c.text3}}">{{s.date}}</span>
<div style="display: flex; align-items: center; gap: 8px">
<span aria-label="{{s.streak}}" style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 16px; background: {{c.ambSoft}}; color: {{c.ambText}}; font-size: 13px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4 0-7-2.7-7-6.5 0-3 2-5 3.5-6.5.3 1.6 1.2 2.6 2.3 3C10.5 7.5 12 5 14 3c.4 3 5 5.5 5 11.5 0 3.8-3 6.5-7 6.5z"></path></svg>6
</span>
<button onClick="{{toNotif}}" aria-label="{{s.notif}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.card}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z M10 21h4"></path></svg>
<span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: {{c.pri}}; border: 2px solid {{c.card}}"></span>
</button>
</div>
</div>
<h1 style="margin: 0; padding: 2px 20px 10px; font-size: {{titleFs}}px; font-weight: 700; letter-spacing: -0.02em; flex: none">{{s.title}}</h1>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 120px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{v.offline}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{c.ambSoft}}; color: {{c.ambText}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18 M5 9.5a14 14 0 0 1 4-2.6 M19 9.5a14 14 0 0 0-6.5-3.2 M8.5 13a7 7 0 0 1 3-1.5 M12 18h.01"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">{{s.offT}}</span>
<span style="font-size: 13px; line-height: 1.4">{{s.offS}}</span>
</div>
</div>
</sc-if>

<sc-if value="{{showTask}}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 20px; background: {{c.taskBg}}; color: #FFFCF6; padding: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 95px; border: 1px solid rgba(255,255,255,.16)"></span>
<span aria-hidden="true" style="position: absolute; right: -10px; top: -20px; width: 110px; height: 110px; border-radius: 55px; border: 1px solid rgba(255,255,255,.12)"></span>
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #F2B33D; color: #2A2420; display: flex; align-items: center; justify-content: center; transform: rotate(-8deg)">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{task.icon}}"></path></svg>
</span>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; opacity: 0.88">{{s.today}}</span>
</div>
<div style="font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em">{{task.t}}</div>
<div style="font-size: 14px; line-height: 1.4; opacity: 0.92">{{task.s}}</div>
<sc-if value="{{v.continue}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; display: flex"><span style="width: 38%; background: #F2B33D; border-radius: 3px"></span></span>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 12px">%38</span>
</div>
</sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px">
<button onClick="{{task.tap}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: {{btnR}}px; background: #FFFCF6; color: #7E2530; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{task.cta}}</button>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 12px; opacity: 0.88">{{task.meta}}</span>
</div>
</div>

<div style="border-radius: 16px; background: {{c.card}}; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
<span style="width: 38px; height: 38px; border-radius: 10px; background: {{c.ambSoft}}; color: {{c.ambText}}; display: flex; align-items: center; justify-content: center; transform: rotate(-7deg); flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4 0-7-2.7-7-6.5 0-3 2-5 3.5-6.5.3 1.6 1.2 2.6 2.3 3C10.5 7.5 12 5 14 3c.4 3 5 5.5 5 11.5 0 3.8-3 6.5-7 6.5z"></path></svg>
</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">{{s.streak}}</span>
<span style="font-size: 12px; color: {{c.text3}}">{{s.streakSub}}</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 5px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 9px; color: {{c.text3}}">{{d.l}}</span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: {{d.bg}}; border: {{d.ring}}; box-sizing: border-box"></span>
</span>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{showTask}}" hint-placeholder-val="{{ true }}">
<section style="border-radius: 16px; background: {{c.card}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; color: {{c.text3}}; flex: 1">{{s.pl.t}}</span>
<button onClick="{{toWeek}}" style="min-height: 32px; border: 0; padding: 0; background: transparent; color: {{c.priText}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{s.pl.week}} →</button>
</div>
<div dir="ltr" lang="tr" style="display: flex; align-items: center; gap: 10px; text-align: left"><span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 11px; color: {{c.text3}}; width: 40px">09:00</span><span style="width: 7px; height: 7px; border-radius: 4px; background: {{c.pri}}"></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{_t.k1202}}</span><span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 10px; color: {{c.text3}}">{{_t.k233}}</span></div>
<div dir="ltr" lang="tr" style="display: flex; align-items: center; gap: 10px; text-align: left"><span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 11px; color: {{c.text3}}; width: 40px">09:40</span><span style="width: 7px; height: 7px; border-radius: 4px; background: {{c.amb}}"></span><span style="flex: 1; font-size: 14px; font-weight: 600">{{_t.k2054}}</span><span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 10px; color: {{c.text3}}">{{_t.k160}}</span></div>
</section>
<button onClick="{{toExam}}" style="border: 0; border-radius: 16px; background: {{c.examBg}}; color: #FFFCF6; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: start; cursor: pointer">
<span style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.14); transform: rotate(-6deg); flex: none"><span style="font-size: 18px; font-weight: 700; line-height: 1">11</span><span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 8px">{{s.ex.d}}</span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{s.ex.t}}</span><span style="font-size: 12px; opacity: .85">{{s.ex.s}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: scaleX({{flip}})"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-if>

<sc-if value="{{v.loading}}" hint-placeholder-val="{{ false }}">
<div aria-busy="true" aria-label="{{s.loading}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="height: 168px; border-radius: 20px; background: {{c.skel}}"></div>
<div style="height: 64px; border-radius: 16px; background: {{c.skel}}"></div>
<div style="display: flex; justify-content: space-between; padding-top: 6px"><span style="width: 90px; height: 16px; border-radius: 8px; background: {{c.skel}}"></span><span style="width: 50px; height: 16px; border-radius: 8px; background: {{c.skel}}"></span></div>
<sc-for list="{{three}}" as="x" hint-placeholder-count="3">
<div style="border-radius: 16px; background: {{c.card}}; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px"><span style="width: 44px; height: 52px; border-radius: 8px; background: {{c.skel}}"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 6px"><span style="width: 60%; height: 14px; border-radius: 7px; background: {{c.skel}}"></span><span style="width: 40%; height: 12px; border-radius: 6px; background: {{c.skel}}"></span></span></div>
<span style="height: 6px; border-radius: 3px; background: {{c.skel}}"></span>
</div>
</sc-for>
<span style="text-align: center; font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 11px; color: {{c.text3}}">{{s.loading}}…</span>
</div>
</sc-if>

<sc-if value="{{v.empty}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 36px 8px 0">
<div aria-hidden="true" style="position: relative; width: 150px; height: 150px">
<span style="position: absolute; left: 22px; top: 18px; width: 92px; height: 118px; border-radius: 10px; background: {{c.card}}; border: 1px solid {{c.line}}; transform: rotate(-10deg)"></span>
<span style="position: absolute; left: 40px; top: 14px; width: 92px; height: 118px; border-radius: 10px; background: {{c.card}}; border: 1px solid {{c.line}}; transform: rotate(4deg); display: flex; flex-direction: column; gap: 7px; padding: 16px 12px; box-sizing: border-box">
<span style="align-self: flex-start; font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 9px; font-weight: 600; color: #FFFCF6; background: {{c.pri}}; border-radius: 3px; padding: 1px 5px">PDF</span>
<span style="height: 5px; width: 90%; border-radius: 3px; background: {{c.line}}"></span><span style="height: 5px; width: 70%; border-radius: 3px; background: {{c.line}}"></span><span style="height: 5px; width: 80%; border-radius: 3px; background: {{c.line}}"></span>
</span>
<span style="position: absolute; right: 6px; bottom: 10px; width: 40px; height: 40px; border-radius: 20px; background: {{c.amb}}; color: #2A2420; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"></path></svg>
</span>
</div>
<h2 style="margin: 6px 0 0; font-size: 22px; font-weight: 700">{{s.emptyT}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.text2}}; max-width: 300px">{{s.emptyS}}</p>
<button onClick="{{toUpload}}" style="margin-top: 10px; height: {{btnH}}px; padding: 0 28px; border: 0; border-radius: {{btnR}}px; background: {{c.pri}}; color: #FFFCF6; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{s.upload}}</button>
<button onClick="{{toReader}}" style="min-height: 44px; border: 0; background: transparent; color: {{c.priText}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{s.sample}}</button>
</div>
</sc-if>

<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 6px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{s.courses}}</h2>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 12px; color: {{c.text3}}">{{s.count}}</span>
</div>
<sc-for list="{{courses}}" as="k" hint-placeholder-count="3">
<button onClick="{{k.tap}}" style="border: 0; border-radius: 16px; background: {{c.card}}; color: {{c.text}}; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: start; font-family: inherit; cursor: pointer; box-shadow: {{c.shadow}}">
<span style="display: flex; gap: 12px; align-items: flex-start; width: 100%">
<span style="width: 44px; height: 52px; border-radius: 8px; background: {{c.sub}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none">
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 9px; font-weight: 600; color: {{c.priText}}">PDF</span>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 11px; color: {{c.text2}}">{{k.pages}}</span>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 17px; font-weight: 600; line-height: 1.25">{{k.name}}</span>
<span style="font-size: 13px; color: {{c.text3}}">{{k.course}}</span>
</span>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 8px; border-radius: 6px; background: {{k.lvlBg}}; color: {{k.lvlFg}}; white-space: nowrap; transform: skewX(-8deg)">{{k.lvl}}</span>
</span>
<span style="display: flex; align-items: center; gap: 10px; width: 100%">
<span style="flex: 1; height: 6px; border-radius: 3px; background: {{c.sub}}; overflow: hidden; display: flex"><span style="width: {{k.pct}}%; background: {{c.pri}}; border-radius: 3px"></span></span>
<span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 12px; color: {{c.text2}}; min-width: 36px; text-align: end">%{{k.pct}}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; width: 100%; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.text3}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 5 5z M3.5 10h17 M8 3v4 M16 3v4"></path></svg>
<span style="color: {{c.text3}}">{{s.next}}:</span>
<span style="font-weight: 600; color: {{k.nextFg}}; background: {{k.nextBg}}; padding: 2px 8px; border-radius: 6px">{{k.next}}</span>
<span style="flex: 1"></span>
<sc-if value="{{v.offline}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'JetBrains Mono', Vazirmatn, ui-monospace, monospace; font-size: 10px; color: {{c.ok}}">{{s.offTag}}</span></sc-if>
</span>
</button>
</sc-for>
<sc-if value="{{ios}}" hint-placeholder-val="{{ true }}">
<button onClick="{{toUpload}}" disabled="{{v.offline}}" style="height: 56px; border-radius: 16px; border: 1.5px dashed {{c.text3}}; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 15px; font-weight: 600; opacity: {{upOpacity}}; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4 M7.5 8.5L12 4l4.5 4.5 M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"></path></svg>
{{s.upload}}
</button>
</sc-if>
<button onClick="{{toPaywall}}" style="border: 0; border-radius: 14px; background: {{c.sub}}; color: {{c.text2}}; min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; cursor: pointer">
<span style="flex: 1; text-align: start">{{s.free}}</span>
<span style="font-weight: 600; color: {{c.priText}}">{{s.upgrade}}</span>
</button>
</sc-if>
</div>

<sc-if value="{{fab}}" hint-placeholder-val="{{ false }}">
<button onClick="{{toUpload}}" style="position: absolute; bottom: 120px; inset-inline-end: 16px; height: 56px; padding: 0 20px 0 16px; border: 0; border-radius: 16px; background: {{c.fabBg}}; color: {{c.fabFg}}; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 3px 8px rgba(27,36,48,.18), 0 1px 3px rgba(27,36,48,.2); cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4 M7.5 8.5L12 4l4.5 4.5 M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"></path></svg>
{{s.upload}}
</button>
</sc-if>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" platform="{{pf}}" theme="{{th}}" lang="{{lang}}" active="home" go="{{tabGo}}" hint-size="100%,83px"></dc-import>
</div>
</div>
</x-dc>
