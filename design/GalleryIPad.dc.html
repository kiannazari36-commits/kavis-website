<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":4968,"height":4792}}'>
class Component extends DCLogic {
  renderVals() {
    const th = this.props.theme || 'light', dark = th === 'dark';
    return { th, bg: dark ? '#0F0D0B' : '#EDE3D2', fg: dark ? '#EFE8DC' : '#2A2420', fg2: dark ? '#BDB2A4' : '#6E645A', shadow: dark ? '0 0 0 1px #3A322B' : '0 1px 2px rgba(42,36,32,.08), 0 14px 34px rgba(42,36,32,.14)',
