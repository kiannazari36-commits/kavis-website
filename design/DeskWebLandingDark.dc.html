<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Web · Tanıtım sitesi · koyu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 1000px">
<dc-import name="DeskApp" screen="landing" frame="web" theme="dark" lang="{{lang}}" w="{{ 1440 }}" h="{{ 1000 }}" hint-size="1440px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["tr","en","fa","ar"],"default":"tr"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { lang: this.props.lang || 'tr' }; }
}
</script>
</body>
</html>
