# XcodeGen spec. Run `xcodegen generate` in this folder to (re)create KavisStudy.xcodeproj.
# The .xcodeproj is generated and not committed; this file is the source of truth.
name: KavisStudy
options:
  bundleIdPrefix: study.kavis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # The Supabase client (auth, database, storage, edge functions), the same backend as the web.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KavisStudy:
    type: application
    platform: iOS
    # Supabase address and publishable key (not in git, see Config/Secrets.example.xcconfig).
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: KavisStudy
        excludes:
          - Info.plist
    info:
      path: KavisStudy/Info.plist
      properties:
        CFBundleDisplayName: Kavis Study
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en, fa, ar]
        UILaunchScreen: {}
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)
        SupabaseLocalURL: $(SUPABASE_LOCAL_URL)
        SupabaseLocalKey: $(SUPABASE_LOCAL_KEY)
        # The local test copy (http://127.0.0.1) in the simulator; real servers stay https only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Permission texts (Turkish here; the other languages are in Resources/<lang>.lproj/InfoPlist.strings).
        NSCameraUsageDescription: Ders sayfalarının, slaytların ve notlarının fotoğrafını çekip okunabilir derse çevirmek için.
        NSPhotoLibraryUsageDescription: Galerindeki ders sayfası ve slayt fotoğraflarını derse eklemek için.
        NSMicrophoneUsageDescription: Derste hocanın anlattıklarını kaydetmek için. Kayıt yalnızca senin hesabında saklanır.
        NSSpeechRecognitionUsageDescription: Ders kaydını bu telefonda metne çevirmek için. Sunucuya sadece metin gider.
        # A live lecture recording goes on while the screen is off.
        UIBackgroundModes: [audio]
        # `kavis://s/<slug>` opens a share link (also used for tests; the web address opens it as a universal link).
        CFBundleURLTypes:
          - CFBundleURLName: study.kavis.app
            CFBundleURLSchemes: [kavis]
        UIAppFonts:
          - Poppins-Regular.ttf
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - Lora.ttf
          - Lora-Italic.ttf
          - JetBrainsMono.ttf
          - Vazirmatn.ttf
    entitlements:
      path: KavisStudy/KavisStudy.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains: ["applinks:kavis-website.vercel.app"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.kavis.app
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for now; iPad later (see TODO.md)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  KavisStudyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KavisStudyTests
      # The local App Store for StoreTests (SKTestSession).
      - path: KavisStudy.storekit
        buildPhase: resources
    dependencies:
      - target: KavisStudy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KavisStudyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KavisStudyUITests
    dependencies:
      - target: KavisStudy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KavisStudy:
    build:
      targets:
        KavisStudy: all
    run:
      # Local App Store simulation for in-app purchase testing (Xcode only; test prices, not the real ones).
      storeKitConfiguration: KavisStudy.storekit
    test:
      targets:
        - KavisStudyTests
        - KavisStudyUITests
